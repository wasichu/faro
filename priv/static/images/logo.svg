<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 64">
  <title>Faro</title>

  <!-- === Badge === -->
  <circle cx="32" cy="32" r="30" fill="#1a0e07"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#78350f" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- Spade suit symbol — ivory, centered in badge -->
  <text
    x="32" y="46"
    font-family="Georgia,'Times New Roman',serif"
    font-size="34"
    fill="#fef3c7"
    text-anchor="middle"
  >♠</text>

  <!-- === Divider with ornamental diamonds === -->
  <text x="70" y="14" font-family="Georgia,serif" font-size="7" fill="#92400e" text-anchor="middle" opacity="0.75">◆</text>
  <line x1="70" y1="17" x2="70" y2="47" stroke="#92400e" stroke-width="1" opacity="0.65"/>
  <text x="70" y="57" font-family="Georgia,serif" font-size="7" fill="#92400e" text-anchor="middle" opacity="0.75">◆</text>

  <!-- === FARO wordmark === -->
  <text
    x="82" y="42"
    font-family="Georgia,'Times New Roman',serif"
    font-size="30"
    font-weight="bold"
    fill="#b45309"
    letter-spacing="6"
  >FARO</text>
</svg>
