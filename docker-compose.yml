services:
  db:
    image: postgres:18
    container_name: faro_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faro_dev
    ports:
      - "127.0.0.1:${FARO_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faro_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - faro_pg_data:/var/lib/postgresql

volumes:
  faro_pg_data:
